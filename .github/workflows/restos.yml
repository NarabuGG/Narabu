# Une fois par semaine : met à jour la liste des restos (ouvertures, fermetures, horaires).
# Le site est remis en ligne par la mise à jour horaire qui suit.
name: Liste des restos
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foodloc
  cancel-in-progress: false
jobs:
  restos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restos.py
      - run: |
          git config user.name "Narabu robot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Mise à jour de la liste des restos" && git push)
