# Une fois par semaine : met à jour la liste des restaurants (OpenStreetMap) pour l'onglet Restaurants.
# Le site est remis en ligne par la mise à jour horaire qui suit.
name: Liste des restaurants
on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foodloc
  cancel-in-progress: false
jobs:
  restaurants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restaurants.py
      - run: |
          git config user.name "Narabu robot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/rs
          git diff --cached --quiet || (git commit -m "Mise à jour de la liste des restaurants" && git push)
