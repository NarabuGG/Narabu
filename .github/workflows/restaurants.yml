# Une fois par semaine : met à jour la liste des restaurants (OpenStreetMap) pour l'onglet Restaurants.
# Source : extraits OpenStreetMap de Geofabrik, région par région (France métropolitaine + outre-mer),
# téléchargés 6 par 6 et filtrés avec osmium. (Overpass est trop souvent saturé pour toute la France.)
# Le site est remis en ligne par la mise à jour horaire qui suit.
name: Liste des restaurants
on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: foodloc
  cancel-in-progress: false
jobs:
  restaurants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Télécharge et filtre OpenStreetMap
        run: |
          mkdir -p /tmp/osm && cd /tmp/osm
          cat > un.sh <<'FIN'
          n=$1
          for essai in 1 2 3; do
            if curl -fsSL --max-time 1500 -w "$n : %{size_download} octets en %{time_total} s\n" -o $n.osm.pbf "https://download.geofabrik.de/europe/france/$n/$n-latest.osm.pbf"; then
              osmium tags-filter $n.osm.pbf nwr/amenity=restaurant -o $n-r.osm.pbf -O &&
              osmium export $n-r.osm.pbf --geometry-types=point,polygon --attributes=type,id -f geojsonseq -o $n.geojsonseq -O &&
              { rm -f $n.osm.pbf; echo "$n : $(wc -l < $n.geojsonseq) restos"; exit 0; }
            fi
            echo "$n : essai $essai raté"; sleep 30
          done
          echo "$n : ÉCHEC"; touch $n.echec
          FIN
          echo alsace aquitaine auvergne basse-normandie bourgogne bretagne centre champagne-ardenne corse \
               franche-comte haute-normandie ile-de-france languedoc-roussillon limousin lorraine midi-pyrenees \
               nord-pas-de-calais pays-de-la-loire picardie poitou-charentes provence-alpes-cote-d-azur rhone-alpes \
               guadeloupe martinique guyane reunion mayotte | tr ' ' '\n' | xargs -P 6 -I{} bash un.sh {}
          ls *.echec 2>/dev/null && { echo "Des régions manquent : on garde l'ancienne liste"; exit 1; } || true
      - run: MINI=20000 python3 scripts/restaurants.py /tmp/osm/*.geojsonseq
      - run: |
          git config user.name "Narabu robot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/rs
          git diff --cached --quiet || (git commit -m "Mise à jour de la liste des restaurants" && git push)
