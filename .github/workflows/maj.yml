# Toutes les heures : apprend des infos données par les gens, met à jour le classement, puis remet le site en ligne.
# Une fois par nuit : met aussi à jour le calendrier officiel et supprime de la base les infos de plus de 60 jours.
name: Mise à jour automatique
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: foodloc
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apprendre des infos des gens, classement, ménage
        run: node scripts/apprendre.mjs || echo "Apprentissage sauté (voir le message au-dessus)"
      - name: Calendrier officiel (la nuit, ou lancement à la main)
        if: github.event_name != 'push'
        run: |
          if [ "$(date +%H)" = "04" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/calendrier.py || echo "Calendrier sauté"
          fi
      - name: Enregistrer les données mises à jour
        run: |
          git config user.name "Narabu robot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Mise à jour automatique des données" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
